<!DOCTYPE html>
<html>
<head>
    <title>Avatar Studio - URL Chunk Queue Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #0f0f1a;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { text-align: center; color: white; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .video-container {
            position: relative;
            width: 256px;
            height: 256px;
            margin: 0 auto;
            background-color: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .video-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('data:image/png;base64,{{AVATAR_BASE64}}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }
        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: transparent !important;
            object-fit: cover;
            pointer-events: none;
            transition: opacity 160ms linear;
        }
        #idleVideo {
            z-index: 2;
            opacity: 0;
        }
        #videoA, #videoB {
            z-index: 3;
            opacity: 0;
        }
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #667eea;
            border-color: #667eea;
        }
        .input-panel {
            display: none;
            margin: 20px 0;
        }
        .input-panel.active {
            display: block;
        }
        .mic-area {
            text-align: center;
            margin: 20px 0;
        }
        .record-btn {
            width: 280px;
            height: 80px;
            border-radius: 40px;
            background: transparent;
            border: 3px solid #667eea;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            transition: all 0.2s;
            box-shadow: 0 5px 20px rgba(102,126,234,0.2);
        }
        .record-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(102,126,234,0.4);
        }
        .record-btn.recording {
            border-color: #f56565;
            color: #f56565;
            box-shadow: 0 5px 25px rgba(245,101,101,0.4);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            resize: vertical;
        }
        textarea::placeholder {
            color: #aaa;
        }
        .voice-select {
            width: 100%;
            padding: 10px;
            background: #2d3748;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            margin: 10px 0;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }
        .voice-select option {
            background: #1a1a2e;
            color: white;
        }
        .voice-select:hover {
            border-color: #667eea;
        }
        .send-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: all 0.2s;
            width: 100%;
        }
        .send-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .response-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .response-text {
            color: #48bb78;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
        }
        .chunk-visualization {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        .chunk {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .chunk-pending { background: rgba(255,255,255,0.1); color: #666; }
        .chunk-ready { background: #48bb78; color: white; }
        .chunk-playing { background: #667eea; color: white; transform: scale(1.15); }
        .chunk-done { background: #2d3748; color: #aaa; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }
        .status.info { background: rgba(255,255,255,0.1); color: #aaa; }
        .status.success { background: rgba(72,187,120,0.2); color: #48bb78; }
        .status.error { background: rgba(245,101,101,0.2); color: #f56565; }
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .control-btn {
            padding: 8px 20px;
            background: rgba(102,126,234,0.8);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            color: white;
        }
        .volume-slider { width: 100px; vertical-align: middle; }
        .optimization-badge {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(72,187,120,0.2);
            border-radius: 12px;
            font-size: 12px;
            color: #48bb78;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Avatar Studio</h1>
        <div class="subtitle">URL Chunk Queue • Dual Video Preload • Gap Reduction Test</div>

        <div class="video-container" id="videoContainer">
            <video id="idleVideo" autoplay loop muted playsinline preload="auto"></video>
            <video id="videoA" playsinline preload="auto"></video>
            <video id="videoB" playsinline preload="auto"></video>
        </div>

        <div class="control-bar">
            <button class="control-btn" onclick="toggleMute()">🔊 Mute</button>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" onchange="setVolume(this.value)">
            <span id="volumeLabel" style="color:#888;">80%</span>
        </div>

        <div class="mode-toggle">
            <button id="voiceModeBtn" class="mode-btn active" onclick="setMode('voice')">🎤 Voice Input</button>
            <button id="textModeBtn" class="mode-btn" onclick="setMode('text')">💬 Text Input</button>
        </div>

        <div id="voicePanel" class="input-panel active">
            <div class="mic-area">
                <button id="recordBtn" class="record-btn">🎤 Press SPACEBAR to Speak</button>
                <p style="color:#888; margin-top: 10px;">Press and hold the SPACEBAR to record<br>Release to send</p>
            </div>
            <select id="voiceVoice" class="voice-select">
                <option value="">Loading voices...</option>
            </select>
                <textarea id="systemPromptVoice" class="voice-select" rows="3" placeholder="System prompt (optimized for short sentences)">You are a helpful AI assistant speaking through an avatar.

            CRITICAL RULES:
            1. Keep EVERY sentence SHORT - maximum 12 words or 60 characters
            2. ALWAYS end each sentence with a period, question mark, or exclamation point
            3. Break long thoughts into multiple short, complete sentences
            4. Use simple, direct language</textarea>
        </div>

        <div id="textPanel" class="input-panel">
            <textarea id="textInput" rows="3" placeholder="Type your question for Gemma 4..."></textarea>
            <select id="textVoice" class="voice-select">
                <option value="">Loading voices...</option>
            </select>
            <textarea id="systemPromptText" class="voice-select" rows="3" placeholder="System prompt (optimized for short sentences)">You are a helpful AI assistant speaking through an avatar.

CRITICAL RULES:
1. Keep EVERY sentence SHORT - maximum 12 words or 60 characters
2. ALWAYS end each sentence with a period, question mark, or exclamation point
3. Break long thoughts into multiple short, complete sentences
4. Use simple, direct language</textarea>
            <button class="send-btn" onclick="sendText()">🎬 Send to Gemma 4</button>
        </div>

        <div id="responseBox" class="response-box" style="display:none;">
            <div id="responseText" class="response-text"></div>
        </div>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill">0%</div>
        </div>

        <div id="chunkVisualization" class="chunk-visualization"></div>

        <div class="stats">
            <span id="chunkStatus">Ready</span>
            <span id="timeStatus"></span>
        </div>

        <div id="status" class="status info">Press and hold SPACEBAR to speak, release to send</div>

        <div class="optimization-badge">
            ⚡ URL chunk playback | preloads next clip | ready for idle/filler layer
        </div>
    </div>

    <script>
        const idleVideo = document.getElementById('idleVideo');
        const videoA = document.getElementById('videoA');
        const videoB = document.getElementById('videoB');
        const videos = [videoA, videoB];

        const statusDiv = document.getElementById('status');
        const progressFill = document.getElementById('progressFill');
        const chunkStatusSpan = document.getElementById('chunkStatus');
        const timeStatusSpan = document.getElementById('timeStatus');
        const chunkVisualization = document.getElementById('chunkVisualization');
        const responseBox = document.getElementById('responseBox');
        const responseTextDiv = document.getElementById('responseText');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let sessionId = null;
        let totalChunks = 0;
        let currentChunk = 0;
        let readyChunks = [];
        let isMuted = false;
        let recordStartTime = null;

        let activeVideoIndex = 0;
        let playbackRunId = 0;
        let isPlaybackActive = false;

        const CROSSFADE_MS = 220;

        const recordBtn = document.getElementById('recordBtn');
        const voicePanel = document.getElementById('voicePanel');
        const textPanel = document.getElementById('textPanel');
        const voiceModeBtn = document.getElementById('voiceModeBtn');
        const textModeBtn = document.getElementById('textModeBtn');
        const voiceVoiceSelect = document.getElementById('voiceVoice');
        const textVoiceSelect = document.getElementById('textVoice');

        idleVideo.src = '/chunks/idle4.mp4';
        idleVideo.onerror = () => {
            idleVideo.removeAttribute('src');
            idleVideo.style.opacity = '0';
        };

        function currentVideo() {
            return videos[activeVideoIndex];
        }

        function nextVideo() {
            return videos[1 - activeVideoIndex];
        }

        function applyVolume() {
            const vol = Number(volumeSlider.value) / 100;
            videos.forEach(v => {
                v.volume = vol;
                v.muted = isMuted;
            });
            idleVideo.muted = true;
        }

        function showIdle() {
            videos.forEach(v => {
                v.style.opacity = '0';
                try { v.pause(); } catch (_) {}
            });

            if (idleVideo.src) {
                idleVideo.style.opacity = '1';
                idleVideo.play().catch(() => {});
            }
        }

        function hideIdle() {
            idleVideo.style.opacity = '0';
        }

        function setStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            console.log(message);
        }

        async function loadVoices() {
            try {
                const response = await fetch('/voices');
                const data = await response.json();
                const voices = data.voices || [];

                [voiceVoiceSelect, textVoiceSelect].forEach(select => {
                    select.innerHTML = '';

                    if (voices.length === 0) {
                        const option = document.createElement('option');
                        option.value = 'jonnydepp';
                        option.textContent = 'Jonny Depp (Default)';
                        select.appendChild(option);
                    } else {
                        voices.forEach(voice => {
                            const option = document.createElement('option');
                            option.value = voice.id;
                            option.textContent = voice.name;
                            if (voice.id === 'jonnydepp') option.selected = true;
                            select.appendChild(option);
                        });
                    }
                });

                console.log(`Loaded ${voices.length} voices`);
            } catch (error) {
                console.error('Error loading voices:', error);

                [voiceVoiceSelect, textVoiceSelect].forEach(select => {
                    select.innerHTML = '';
                    const option = document.createElement('option');
                    option.value = 'jonnydepp';
                    option.textContent = 'Jonny Depp (Default)';
                    select.appendChild(option);
                });
            }
        }

        function setVolume(value) {
            volumeLabel.textContent = value + '%';
            applyVolume();
        }

        function toggleMute() {
            isMuted = !isMuted;
            applyVolume();
            document.querySelector('.control-btn').textContent = isMuted ? '🔇 Unmute' : '🔊 Mute';
        }

        function setMode(mode) {
            if (mode === 'voice') {
                voiceModeBtn.classList.add('active');
                textModeBtn.classList.remove('active');
                voicePanel.classList.add('active');
                textPanel.classList.remove('active');
                setStatus('Press and hold SPACEBAR to speak, release to send', 'info');
            } else {
                voiceModeBtn.classList.remove('active');
                textModeBtn.classList.add('active');
                voicePanel.classList.remove('active');
                textPanel.classList.add('active');
                setStatus('Type your message and click Send to Gemma 4', 'info');
            }

            responseBox.style.display = 'none';
        }

        function updateChunkVisualization(currentIndex) {
            let html = '';

            for (let i = 0; i < totalChunks; i++) {
                let statusClass = 'chunk-pending';

                if (i < currentIndex) statusClass = 'chunk-done';
                else if (i === currentIndex) statusClass = 'chunk-playing';
                else if (readyChunks[i]) statusClass = 'chunk-ready';

                html += '<div class="chunk ' + statusClass + '">' + (i + 1) + '</div>';
            }

            chunkVisualization.innerHTML = html;
        }

        function resetPlaybackState() {
            playbackRunId += 1;
            isPlaybackActive = false;
            currentChunk = 0;
            readyChunks = [];
            totalChunks = 0;

            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            chunkVisualization.innerHTML = '';
            chunkStatusSpan.textContent = 'Ready';
            timeStatusSpan.textContent = '';

            videos.forEach(v => {
                v.pause();
                v.removeAttribute('src');
                v.load();
                v.style.opacity = '0';
                v.onended = null;
                v.onerror = null;
            });

            showIdle();
        }

        async function fetchChunkStatusSafe() {
            if (!sessionId) return null;

            try {
                const response = await fetch('/chunk_status/' + sessionId, { cache: 'no-store' });
                if (!response.ok) return null;

                const data = await response.json();

                if (data.ready) {
                    readyChunks = data.ready;
                    const readyCount = readyChunks.filter(Boolean).length;
                    timeStatusSpan.textContent = '📦 ' + readyCount + '/' + totalChunks + ' chunks ready';
                    updateChunkVisualization(currentChunk);
                }

                return data;
            } catch (err) {
                console.warn('chunk_status failed:', err);
                return null;
            }
        }

        async function waitForChunk(chunkIndex, runId) {
            while (runId === playbackRunId) {
                try {
                    const response = await fetch('/wait_for_chunk/' + sessionId + '/' + chunkIndex, { cache: 'no-store' });

                    if (response.ok) {
                        const data = await response.json();

                        if (data.ready && data.url) {
                            readyChunks[chunkIndex] = true;
                            updateChunkVisualization(currentChunk);
                            return data.url;
                        }
                    }
                } catch (err) {
                    console.warn('wait_for_chunk failed:', err);
                }

                await fetchChunkStatusSafe();
                await new Promise(r => setTimeout(r, 250));
            }

            throw new Error('Playback cancelled');
        }

        function preloadVideoElement(videoElement, url) {
            return new Promise((resolve, reject) => {
                let settled = false;

                const done = () => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve();
                };

                const fail = () => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    reject(new Error('Failed to preload ' + url));
                };

                const cleanup = () => {
                    videoElement.removeEventListener('canplaythrough', done);
                    videoElement.removeEventListener('canplay', done);
                    videoElement.removeEventListener('loadeddata', done);
                    videoElement.removeEventListener('error', fail);
                };

                videoElement.addEventListener('canplaythrough', done, { once: true });
                videoElement.addEventListener('canplay', done, { once: true });
                videoElement.addEventListener('loadeddata', done, { once: true });
                videoElement.addEventListener('error', fail, { once: true });

                videoElement.src = url;
                videoElement.load();

                setTimeout(done, 700);
            });
        }

        async function playPreparedVideo(videoElement, chunkIndex, runId) {
            if (runId !== playbackRunId) return;

            applyVolume();
            hideIdle();

            const outgoing = videos.find(v => v !== videoElement);

            videoElement.currentTime = 0;
            videoElement.style.opacity = '0';

            chunkStatusSpan.textContent = '▶️ Playing chunk ' + (chunkIndex + 1) + '/' + totalChunks;
            currentChunk = chunkIndex;
            updateChunkVisualization(chunkIndex);

            const percent = Math.round((chunkIndex / Math.max(1, totalChunks)) * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';

            requestAnimationFrame(() => {
                videoElement.style.opacity = '1';
                if (outgoing) outgoing.style.opacity = '0';
            });

            await videoElement.play();

            await new Promise((resolve) => {
                videoElement.onended = () => resolve();
                videoElement.onerror = () => resolve();
            });
        }

        async function startPlayback() {
            if (!sessionId || !totalChunks) return;

            const runId = ++playbackRunId;
            isPlaybackActive = true;
            currentChunk = 0;

            readyChunks = new Array(totalChunks).fill(false);
            updateChunkVisualization(-1);

            let nextPrepared = null;
            let nextPreparedIndex = -1;

            try {
                for (let i = 0; i < totalChunks; i++) {
                    if (runId !== playbackRunId) return;

                    const playEl = currentVideo();
                    const preloadEl = nextVideo();

                    let url;

                    if (nextPrepared && nextPreparedIndex === i) {
                        url = nextPrepared.url;
                    } else {
                        chunkStatusSpan.textContent = '⏳ Waiting for chunk ' + (i + 1) + '/' + totalChunks;
                        url = await waitForChunk(i, runId);
                        await preloadVideoElement(playEl, url);
                    }

                    nextPrepared = null;
                    nextPreparedIndex = -1;

                    const preloadPromise = (async () => {
                        if (i + 1 >= totalChunks || runId !== playbackRunId) return null;

                        const nextUrl = await waitForChunk(i + 1, runId);
                        await preloadVideoElement(preloadEl, nextUrl);

                        return { index: i + 1, url: nextUrl };
                    })();

                    await playPreparedVideo(playEl, i, runId);

                    try {
                        const prepared = await preloadPromise;

                        if (prepared) {
                            nextPrepared = prepared;
                            nextPreparedIndex = prepared.index;
                        }
                    } catch (err) {
                        console.warn('Next preload failed:', err);
                    }

                    activeVideoIndex = 1 - activeVideoIndex;
                }

                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                currentChunk = totalChunks;
                updateChunkVisualization(totalChunks);
                setStatus('✅ Complete!', 'success');
            } catch (error) {
                if (runId === playbackRunId) {
                    console.error(error);
                    setStatus('Playback error: ' + error.message, 'error');
                }
            } finally {
                if (runId === playbackRunId) {
                    isPlaybackActive = false;

                    setTimeout(() => {
                        if (runId === playbackRunId && !isPlaybackActive) {
                            showIdle();
                        }
                    }, CROSSFADE_MS);
                }
            }
        }

        async function submitChatForm(formData, isVoice, externalReadAloud = false) {
            setStatus(
                externalReadAloud ? '📖 Reading selected text...' : (isVoice ? '🎧 Processing...' : '💬 Sending to Gemma 4...'),
                'info'
            );

            responseBox.style.display = 'block';
            responseTextDiv.innerHTML = externalReadAloud ? 'Reading selected text...' : (isVoice ? 'Transcribing...' : 'Thinking...');
            recordBtn.disabled = true;
            recordBtn.style.opacity = '0.5';

            try {
                const requestStart = performance.now();
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const data = await response.json();

                if (!data.success) {
                    setStatus('❌ Error: ' + (data.error || 'Unknown error'), 'error');
                    responseTextDiv.innerHTML = 'Error: ' + (data.error || 'Unknown error');
                    return;
                }

                sessionId = data.session_id;
                totalChunks = data.total_chunks || 0;
                readyChunks = new Array(totalChunks).fill(false);

                const requestMs = Math.round(performance.now() - requestStart);
                console.log('POST /chat returned in', requestMs, 'ms');

                if (externalReadAloud) {
                    responseTextDiv.innerHTML =
                        '📖 <strong>Reading selected text:</strong><br>' + (data.response_text || '');
                } else if (isVoice) {
                    responseTextDiv.innerHTML =
                        '🎤 <strong>You said:</strong><br>' + (data.transcript || '') +
                        '<br><br>🤖 <strong>Gemma 4:</strong><br>' + (data.response_text || '');
                } else {
                    responseTextDiv.innerHTML =
                        '🤖 <strong>Gemma 4:</strong><br>' + (data.response_text || '');
                }

                setStatus('✅ ' + (data.message || 'Response ready, waiting for first chunk...'), 'success');
                chunkStatusSpan.textContent = '⏳ Waiting for first chunk...';
                updateChunkVisualization(-1);

                await startPlayback();
            } catch (error) {
                setStatus('❌ Error: ' + error.message, 'error');
                responseTextDiv.innerHTML = 'Error: ' + error.message;
            } finally {
                recordBtn.disabled = false;
                recordBtn.style.opacity = '1';
            }
        }

        async function handleExternalReadAloud(text) {
            if (!text || !text.trim()) return;

            console.log("📥 External read aloud:", text);

            resetPlaybackState();

            const formData = new FormData();
            formData.append("text", text.trim());
            formData.append("voice", textVoiceSelect.value || voiceVoiceSelect.value || "jonnydepp");
            formData.append("read_aloud", "true");

            console.log("🔊 Submitting /chat with read_aloud=true");

            await submitChatForm(formData, false, true);
        }

        function connectUiWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${location.host}/ws/ui`);

            ws.onopen = () => {
                console.log('✅ UI WebSocket connected');
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'external_read_aloud') {
                        console.log('📥 External read aloud:', data.text);
                        await handleExternalReadAloud(data.text);
                    }
                } catch (err) {
                    console.error('UI WebSocket message error:', err);
                }
            };

            ws.onclose = () => {
                console.warn('⚠️ UI WebSocket closed, reconnecting...');
                setTimeout(connectUiWebSocket, 1000);
            };

            ws.onerror = (err) => {
                console.warn('UI WebSocket error:', err);
                try { ws.close(); } catch (_) {}
            };
        }

        document.addEventListener('keydown', async (event) => {
            if (event.code === 'Space' && !isRecording && voicePanel.classList.contains('active')) {
                const activeElement = document.activeElement;
                const isTyping = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA');

                if (!isTyping) {
                    event.preventDefault();
                    startRecording();
                }
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.code === 'Space' && isRecording && voicePanel.classList.contains('active')) {
                event.preventDefault();
                stopRecording();
            }
        });

        async function startRecording() {
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const duration = (Date.now() - recordStartTime) / 1000;

                    if (duration < 0.5) {
                        setStatus('⏱️ Recording too short. Please speak for at least 1 second.', 'error');
                        stream.getTracks().forEach(track => track.stop());
                        resetRecordingUI();
                        return;
                    }

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'recording.webm');
                    formData.append('voice', voiceVoiceSelect.value);
                    formData.append('system_prompt', document.getElementById('systemPromptVoice').value);

                    await submitChatForm(formData, true);

                    stream.getTracks().forEach(track => track.stop());
                    resetRecordingUI();
                };

                resetPlaybackState();

                mediaRecorder.start();
                isRecording = true;
                recordStartTime = Date.now();
                recordBtn.classList.add('recording');
                recordBtn.textContent = '🔴 Recording... Release SPACEBAR to send';
                setStatus('🎤 Recording... release SPACEBAR when done', 'info');

                setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 30000);
            } catch (error) {
                setStatus('❌ Could not access microphone. Please check permissions.', 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function resetRecordingUI() {
            recordBtn.disabled = false;
            recordBtn.style.opacity = '1';
            recordBtn.classList.remove('recording');
            recordBtn.textContent = '🎤 Press SPACEBAR to Speak';
        }

        async function sendText() {
            const text = document.getElementById('textInput').value;
            const voice = textVoiceSelect.value;
            const systemPrompt = document.getElementById('systemPromptText').value;

            if (!text.trim()) {
                setStatus('Please enter text', 'error');
                return;
            }

            resetPlaybackState();

            const formData = new FormData();
            formData.append('text', text);
            formData.append('voice', voice);
            formData.append('system_prompt', systemPrompt);

            await submitChatForm(formData, false);
        }


        async function generateIdleOnLoad() {
            try {
                setStatus("⚙️ Preparing idle animation...", "info");

                const formData = new FormData();
                formData.append("seconds", "10");

                const response = await fetch("/generate_idle", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.ok) {
                    idleVideo.src = "/chunks/idle.mp4?cache=" + Date.now();
                    idleVideo.load();
                    idleVideo.play().catch(() => {});
                    showIdle();
                    setStatus("✅ Idle ready", "success");
                } else {
                    setStatus("⚠️ Idle unavailable: " + data.error, "error");
                }
            } catch (err) {
                console.error(err);
                setStatus("⚠️ Idle generation failed", "error");
            }
        }

        loadVoices();
        setVolume(80);
        showIdle();
        connectUiWebSocket();

        //window.addEventListener("load", () => {
        //    generateIdleOnLoad();
        //});
    </script>
</body>
